<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>投递追踪 - 秋招网申助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2329; font-size: 13px; background: #f7f8fa; padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .sub { color: #646a73; margin-bottom: 16px; }
    .toolbar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px;
      background: #fff; padding: 12px; border-radius: 10px;
    }
    input, select, button {
      border: 1px solid #dcdfe6; border-radius: 6px; padding: 7px 10px; font-size: 13px;
    }
    input { min-width: 160px; }
    button { background: #6b4cf0; color: #fff; border: none; cursor: pointer; }
    button.secondary { background: #eef2f7; color: #6b4cf0; }
    table {
      width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px;
      overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    th { background: #f7f8fa; color: #646a73; font-weight: 600; font-size: 12px; }
    tr:hover { background: #fafbfc; }
    td input, td select { width: 100%; border-color: transparent; background: transparent; }
    td input:hover, td select:hover, td input:focus, td select:focus { background: #fff; border-color: #6b4cf0; }
    .link-cell a { color: #6b4cf0; text-decoration: none; }
    .link-cell a:hover { text-decoration: underline; }
    .link-short { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
    .del-btn { background: #fff0f0; color: #c24; padding: 4px 10px; font-size: 12px; }
    .empty { text-align: center; color: #999; padding: 40px; }
    .stats { display: flex; gap: 16px; margin-bottom: 14px; }
    .stat { background: #fff; padding: 10px 16px; border-radius: 10px; }
    .stat b { color: #6b4cf0; font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>投递追踪</h1>
    <div class="sub">记录你投了哪些岗位、当前进度。打开招聘页时插件会自动抓取企业与岗位名。</div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input id="searchInput" placeholder="搜索企业 / 岗位 / 状态">
      <button id="addBtn">手动添加</button>
      <button id="captureBtn" class="secondary">抓取当前招聘页</button>
      <button id="exportBtn" class="secondary">导出 CSV</button>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:110px">投递时间</th>
          <th style="width:140px">企业</th>
          <th style="width:180px">岗位</th>
          <th style="width:110px">状态</th>
          <th>投递链接</th>
          <th style="width:70px">操作</th>
        </tr>
      </thead>
      <tbody id="appTable"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">还没有投递记录，点「手动添加」或「抓取当前招聘页」开始记录。</div>
  </div>

  <script src="tracker.js"></script>
</body>
</html>
